id: io.prism.Monitor
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: prism-monitor
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: prism-monitor
    buildsystem: simple
    build-commands:
      - make -j$(nproc)
      - make install PREFIX=/app
    sources:
      - type: dir
        path: .
